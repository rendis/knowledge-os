# Knowledge gates for a cell vault, installed and updated by `kos kernel update` (managed: change it in the
# distribution, never in the vault). Every push and pull request runs `kos sync verify` with the kos release that
# matches the vault's kernel (the lock's kernel_version): a knowledge change that did not pass the gates and an
# accepted review on a sync/ branch fails here, including a commit made directly on the base branch. A range with
# no knowledge change (a kernel update) passes. Anchors whose sources are not checked out are reported as pending;
# structural checks, note structure and the review binding are enforced. GitHub ignores this file in a vault hosted
# elsewhere; there, run the same command in that host's CI. A pull request checks out the branch's own head, not the
# temporary merge GitHub creates: that merge keeps the branch's review commits off its first-parent history. A private fork of the distribution sets
# KOS_RELEASES_REPO and a token with read access to its releases.
name: knowledge-gates
on:
  pull_request:
  push:
    branches-ignore: ["sync/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install kos
        env:
          KOS_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          export KOS_VERSION="$(sed -n 's/^kernel_version: "\(.*\)"$/\1/p' .knowledge-os.lock.yaml)"
          curl -fsSL "https://github.com/${KOS_RELEASES_REPO:-rendis/knowledge-os}/releases/download/v$KOS_VERSION/install-kos.sh" | sh
          echo "$KOS_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Verify reviewed knowledge
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$PR_BASE"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          else
            base="$BEFORE"
          fi
          kos sync verify --vault . --base "$base" --allow-no-change
