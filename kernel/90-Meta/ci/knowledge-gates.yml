# Optional CI gate for a cell vault. Copy to .github/workflows/knowledge-gates.yml when the team
# wants the remote to enforce the same gates as `kos sync verify` on every pull request.
# It installs the kos release that matches the vault's kernel (the lock's kernel_version), so the gates
# run with the kernel's own rules. KOS_RELEASES_TOKEN is a repository secret with read access to the
# releases repository. No source repository or cloud access is needed: anchors whose sources are not
# checked out are reported as pending; structural checks and the review binding are enforced.
name: knowledge-gates
on:
  pull_request:
    paths: ["[1-7]*-*/**", "00-Home.md", "*.base", "90-Meta/.sync-acknowledgements.json", "investigations/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install kos
        env:
          GH_TOKEN: ${{ secrets.KOS_RELEASES_TOKEN }}
          KOS_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          export KOS_VERSION="$(sed -n 's/^kernel_version: "\(.*\)"$/\1/p' .knowledge-os.lock.yaml)"
          gh release download "v$KOS_VERSION" --repo rendis/knowledge-os --pattern install-kos.sh --output - | sh
          echo "$KOS_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Verify reviewed knowledge
        run: kos sync verify --vault . --base "origin/${{ github.base_ref }}"
