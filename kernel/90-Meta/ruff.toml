target-version = "py39"
required-version = "==0.16.7"
extend-exclude = [
    ".operations",
    ".plan",
    "output",
]

[lint]
select = ["E4", "E7", "E9", "F"]

# Some distribution evals deliberately use compact fixture code. Keep the
# correctness rules while leaving that fixture style outside the baseline.
[lint.per-file-ignores]
"evals/**/*.py" = ["E401", "E402", "E701", "E702", "F401", "F841"]
