# Local workspace contract (version 1)

The writer is `onboard-developer`. Consumers select the executable through `use-vault-cli` and call `<CLI> config` with an explicit `--vault` root.

```yaml
version: 1
workspace:
  repository_roots: []
  managed_clone:
    enabled: false
    root: ""
skills:
  manage-development-handoff:
    worktree_root: ""
  inspect-database:
    environments: {}
```

Secret-bearing keys are prohibited. Discovery roots are read-only unless a development-handoff plan is authorized.

The native CLI reads one YAML mapping, bounded to 4 MiB. Duplicate keys, malformed known fields and invalid existing state fail without overwriting the file. Updates preserve comments, unknown consumer-owned fields and other configured environments. Proxy ports must be integers from 1 through 65535. Configuration writes are serialized and atomically replaced; `--expected-hash` can bind a mutation to the reviewed file contents. No command executes a configured procedure or grants new access authority.
