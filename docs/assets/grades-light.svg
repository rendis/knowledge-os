<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 120" width="960" height="120" role="img" aria-labelledby="title desc">
<title id="title">Evidence grades</title>
<desc id="desc">Demonstrated: the inspected source shows it. Observed within limits: sample, environment or time window stated. Inferred: the step from demonstrated facts is explicit. Unresolved: the missing source is named with how to obtain it.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1f2328}.muted{fill:#59636e}</style>
<rect x="1" y="1" width="226" height="118" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-opacity=".45"/><circle cx="27" cy="36" r="6" fill="#1a7f37"/><text x="41" y="42" font-size="17" font-weight="600" fill="#1a7f37" style="fill:#1a7f37">demonstrated</text><text x="21" y="78" font-size="13.5" class="muted">The inspected source shows it:</text><text x="21" y="98" font-size="13.5" class="muted">file and lines, snapshot, query.</text><rect x="241" y="1" width="226" height="118" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-opacity=".45"/><circle cx="267" cy="36" r="6" fill="#0969da"/><text x="281" y="42" font-size="17" font-weight="600" fill="#0969da" style="fill:#0969da">observed</text><text x="261" y="78" font-size="13.5" class="muted">Within stated limits: sample,</text><text x="261" y="98" font-size="13.5" class="muted">environment or time window.</text><rect x="481" y="1" width="226" height="118" rx="14" fill="#fff8c5" stroke="#9a6700" stroke-opacity=".45"/><circle cx="507" cy="36" r="6" fill="#9a6700"/><text x="521" y="42" font-size="17" font-weight="600" fill="#9a6700" style="fill:#9a6700">inferred</text><text x="501" y="78" font-size="13.5" class="muted">The step from demonstrated</text><text x="501" y="98" font-size="13.5" class="muted">facts is made explicit.</text><rect x="721" y="1" width="226" height="118" rx="14" fill="#eaeef2" stroke="#59636e" stroke-opacity=".45"/><circle cx="747" cy="36" r="6" fill="#59636e"/><text x="761" y="42" font-size="17" font-weight="600" fill="#59636e" style="fill:#59636e">unresolved</text><text x="741" y="78" font-size="13.5" class="muted">The missing source is named,</text><text x="741" y="98" font-size="13.5" class="muted">with how to obtain it.</text>
</svg>
