<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" role="img" aria-labelledby="title desc">
<title id="title">knowledge-os</title>
<desc id="desc">A question enters the vault, which follows the trail to repositories, cloud snapshots, databases and trackers; the answer comes back sourced and graded, and what was learned returns to the vault through a gated sync.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#afb8c1"/></marker></defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1f2328}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.muted{fill:#59636e}
.edge{fill:none;stroke:#afb8c1;stroke-width:1.5}
.node{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
.vault{fill:#eeedfe;stroke:#534ab7;stroke-width:1.5}
.vault-label{fill:#3c3489;font-weight:600;font-size:17px}
.note{fill:#ffffff;stroke:#534ab7;stroke-width:1}
.note-line{stroke:#534ab7;stroke-width:1.5;stroke-linecap:round;opacity:.6}
.source{fill:#e1f5ee;stroke:#0f6e56;stroke-width:1.5}
.source-label{fill:#085041;font-size:14px;font-weight:500}
.pulse{fill:none;stroke:#534ab7;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:14 200;stroke-dashoffset:14}
.p1{animation:p1 8s linear infinite}.p2{animation:p2 8s linear infinite}.p3{animation:p3 8s linear infinite}.p4{animation:p4 8s linear infinite}
@keyframes p1{0%{stroke-dashoffset:14}10%,100%{stroke-dashoffset:-100}}
@keyframes p2{0%,10%{stroke-dashoffset:14}22%,100%{stroke-dashoffset:-100}}
@keyframes p3{0%,26%{stroke-dashoffset:14}38%,100%{stroke-dashoffset:-100}}
@keyframes p4{0%,46%{stroke-dashoffset:14}66%,100%{stroke-dashoffset:-100}}
.flash{fill:none;stroke:#0f6e56;stroke-width:3;opacity:0;animation:flash 8s ease-out infinite}
@keyframes flash{0%,20%{opacity:0}23%{opacity:1}32%,100%{opacity:0}}
.glow{fill:none;stroke:#534ab7;stroke-width:3;opacity:0;animation:glow 8s ease-out infinite}
@keyframes glow{0%,64%{opacity:0}67%{opacity:1}80%,100%{opacity:0}}
.grade{opacity:0;animation:grade 8s ease-out infinite}
@keyframes grade{0%,37%{opacity:0}41%,92%{opacity:1}97%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse,.flash,.glow{display:none}.grade{animation:none;opacity:1}}
</style>
<rect x="1" y="1" width="958" height="442" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<g transform="translate(40 44)">
<circle cx="8" cy="10" r="6" fill="#534ab7"/><circle cx="30" cy="4" r="4" fill="#0f6e56"/><circle cx="28" cy="26" r="5" fill="#0f6e56"/>
<path d="M8 10L30 4M8 10L28 26" stroke="#afb8c1" stroke-width="1.5"/>
</g>
<text x="86" y="74" font-size="36" font-weight="600">knowledge-os</text>
<text x="40" y="112" font-size="19" class="muted">Your team's systems, mapped. Every answer, sourced.</text>
<path class="edge" d="M230 260H286" marker-end="url(#arrow)"/>
<path class="edge" d="M460 260C495 260 495 181 526 181" marker-end="url(#arrow)"/><path class="edge" d="M460 260C495 260 495 234 526 234" marker-end="url(#arrow)"/><path class="edge" d="M460 260C495 260 495 287 526 287" marker-end="url(#arrow)"/><path class="edge" d="M460 260C495 260 495 340 526 340" marker-end="url(#arrow)"/><path class="edge" d="M700 181C735 181 735 260 766 260" marker-end="url(#arrow)"/><path class="edge" d="M700 234C735 234 735 260 766 260" marker-end="url(#arrow)"/><path class="edge" d="M700 287C735 287 735 260 766 260" marker-end="url(#arrow)"/><path class="edge" d="M700 340C735 340 735 260 766 260" marker-end="url(#arrow)"/>
<path class="edge" d="M845 295C845 422 375 422 375 314" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<text x="610" y="430" font-size="13" text-anchor="middle" class="muted">retained through a gated, reviewed sync</text>
<rect class="node" x="40" y="225" width="190" height="70" rx="12"/>
<text x="135" y="252" font-size="15" font-weight="600" text-anchor="middle">Question</text>
<text x="135" y="275" font-size="12.5" text-anchor="middle" class="mono muted">who consumes order.paid?</text>
<rect class="vault" x="290" y="210" width="170" height="100" rx="12"/>
<rect class="glow" x="290" y="210" width="170" height="100" rx="12"/>
<text class="vault-label" x="375" y="245" text-anchor="middle">Vault</text>
<rect x="318" y="264" width="32" height="30" rx="4" class="note"/><path d="M324 273h20M324 280h14M324 287h17" class="note-line"/><rect x="358" y="264" width="32" height="30" rx="4" class="note"/><path d="M364 273h20M364 280h14M364 287h17" class="note-line"/><rect x="398" y="264" width="32" height="30" rx="4" class="note"/><path d="M404 273h20M404 280h14M404 287h17" class="note-line"/>
<rect class="source" x="530" y="160" width="170" height="42" rx="10"/><rect class="flash" x="530" y="160" width="170" height="42" rx="10"/><text class="source-label" x="615" y="186" text-anchor="middle">Repositories</text><rect class="source" x="530" y="213" width="170" height="42" rx="10"/><rect class="flash" x="530" y="213" width="170" height="42" rx="10"/><text class="source-label" x="615" y="239" text-anchor="middle">Cloud snapshots</text><rect class="source" x="530" y="266" width="170" height="42" rx="10"/><rect class="flash" x="530" y="266" width="170" height="42" rx="10"/><text class="source-label" x="615" y="292" text-anchor="middle">Databases</text><rect class="source" x="530" y="319" width="170" height="42" rx="10"/><rect class="flash" x="530" y="319" width="170" height="42" rx="10"/><text class="source-label" x="615" y="345" text-anchor="middle">Trackers</text>
<rect class="node" x="770" y="225" width="150" height="70" rx="12"/>
<text x="845" y="252" font-size="15" font-weight="600" text-anchor="middle">Answer</text>
<text x="845" y="275" font-size="12.5" text-anchor="middle" class="muted">sourced, checked</text>
<g class="grade"><rect x="785" y="182" width="120" height="28" rx="14" fill="#dafbe1" stroke="#1a7f37"/>
<text x="845" y="201" font-size="13" font-weight="600" text-anchor="middle" fill="#1a7f37" style="fill:#1a7f37">demonstrated</text></g>
<text x="495" y="150" font-size="12" text-anchor="middle" class="muted">the map, not the boundary</text>
<path class="pulse p1" pathLength="100" d="M230 260H286"/>
<path class="pulse p2" pathLength="100" d="M460 260C495 260 495 181 526 181"/><path class="pulse p2" pathLength="100" d="M460 260C495 260 495 234 526 234"/><path class="pulse p2" pathLength="100" d="M460 260C495 260 495 287 526 287"/><path class="pulse p2" pathLength="100" d="M460 260C495 260 495 340 526 340"/><path class="pulse p3" pathLength="100" d="M700 181C735 181 735 260 766 260"/><path class="pulse p3" pathLength="100" d="M700 234C735 234 735 260 766 260"/><path class="pulse p3" pathLength="100" d="M700 287C735 287 735 260 766 260"/><path class="pulse p3" pathLength="100" d="M700 340C735 340 735 260 766 260"/>
<path class="pulse p4" pathLength="100" d="M845 295C845 422 375 422 375 314"/>
</svg>
